# Checks every push; in Render set Auto-Deploy to "After CI Checks Pass" so broken code is never deployed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the code.
permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Installs like Vercel does; npm ci fails on Linux because this lockfile was made on Windows.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
